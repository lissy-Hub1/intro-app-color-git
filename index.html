<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/2071/2071669.png" type="image/x-icon">
    <!-- Agregar Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@400&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Delius+Swash+Caps&family=Liter&family=Shizuru&family=Sour+Gummy:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    
    <title>Mezclador de Colores</title>
</head>

<body class="bg-dark">

    
    <!-- Navbar transparente -->
    <nav class="navbar navbar-expand-lg navbar-light fixed-top">
        <div class="container">
            <a class="navbar-brand text-white fw-bold" href="#">
                <img src="https://cdn-icons-png.flaticon.com/512/2071/2071669.png" alt="Logo" width="30" height="30" class="d-inline-block align-text-top">
                Mezclador de Colores
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link text-white" href="#">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="#">Acerca de</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="#">Contacto</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Espaciado para que el navbar no cubra el contenido -->
    <div class="mt-5 pt-5"></div>

    <div class="container text-center mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-sm-12">
                <div class="card shadow-lg border-light rounded p-4">
                    <div class="card-img-top">
                        <div class="color-box mt-3" id="colorBox"></div>
                        <p class="mt-2" id="hexCode" style="font-weight: bold; font-size: 1.25rem;">#FFFFFF</p>
                    </div>
                    <div class="card-body">
                        <h5 class="card-title mb-4">Mezclador de Colores</h5>

                        <div class="form-group mb-3">
                            <label for="colorPicker" class="form-label">Elige un color</label>
                            <input type="color" id="colorPicker" class="form-control form-control-lg" value="#ffffff">
                        </div>

                        <div class="form-group mb-3">
                            <label for="rojo" class="form-label">Rojo</label>
                            <input type="range" id="rojo" class="form-range" min="0" max="255" value="0">
                            <input type="number" id="rojoValue" class="form-control form-control-sm" min="0" max="255" value="0">
                        </div>

                        <div class="form-group mb-3">
                            <label for="verde" class="form-label">Verde</label>
                            <input type="range" id="verde" class="form-range" min="0" max="255" value="0">
                            <input type="number" id="verdeValue" class="form-control form-control-sm" min="0" max="255" value="0">
                        </div>

                        <div class="form-group mb-3">
                            <label for="azul" class="form-label">Azul</label>
                            <input type="range" id="azul" class="form-range" min="0" max="255" value="0">
                            <input type="number" id="azulValue" class="form-control form-control-sm" min="0" max="255" value="0">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer mt-5">
        <div class="footer-container">
            
            <div class="brand">
                <p>Desarrollado por Lisset Gutiérrez Cruz</p>
                <p>© 2025 Lissy-Hub. Todos los derechos reservados.</p>
            </div>
            
        </div>
    </footer>
    
    

    <script src="js/scripts.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js"></script>
</body>

</html>
